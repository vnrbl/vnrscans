<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="bg_let-him-cook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="glow_let-him-cook" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border_let-him-cook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow_let-him-cook" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="badgeShadow_let-him-cook" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="10" y="10" width="300" height="300" rx="32" fill="url(#bg_let-him-cook)" stroke="url(#border_let-him-cook)" stroke-width="4" filter="url(#shadow_let-him-cook)" />

  <!-- Radial Glow Behind Emoji -->
  <circle cx="160" cy="120" r="95" fill="url(#glow_let-him-cook)" />

  <!-- Diagonal Action Lines Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="30" y1="30" x2="290" y2="290" />
    <line x1="70" y1="20" x2="300" y2="250" />
    <line x1="20" y1="70" x2="250" y2="300" />
    <line x1="120" y1="20" x2="300" y2="200" />
    <line x1="20" y1="120" x2="200" y2="300" />
  </g>

  <!-- Big Central Emoji -->
  <text x="160" y="155" font-size="96" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow_let-him-cook)">
    🍳
  </text>

  <!-- Banner Pill Background -->
  <rect x="25" y="210" width="270" height="52" rx="16" fill="#09090b" fill-opacity="0.88" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.6" filter="url(#badgeShadow_let-him-cook)" />

  <!-- Main Bold Text -->
  <text x="160" y="242" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    LET HIM COOK
  </text>

  <!-- Subtitle Tag -->
  <text x="160" y="285" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.2" opacity="0.95">
    🔥 SOMETHING IS BREWING 🔥
  </text>

  <!-- Glossy Specular Arc -->
  <path d="M 30 50 Q 160 20 290 50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />
</svg>